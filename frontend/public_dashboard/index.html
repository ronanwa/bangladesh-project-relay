<!DOCTYPE html>
<!--
  Project: Bangladesh Project Relay
  File: frontend/public_dashboard/index.html
  Author: Ronan Wallace (https://github.com/ronanwa)

  Public dashboard - placeholder page.
  The real map dashboard is drafted in index_draft.html.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project RELAY - Public Dashboard</title>
  <style>
    :root {
      --relay-blue: #b0c5de;   /* banner background, matches project-relay.org logo */
      --ink: #0d1b2a;          /* dark navy used across the Project Relay site */
    }

    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #f5f5f5;
    }

    /* --- Banner ------------------------------------------------ */
    .banner {
      background: var(--relay-blue);
      display: flex;
      align-items: center;
      padding: 0 clamp(1rem, 4vw, 3rem);
    }
    .banner img {
      height: clamp(44px, 8vw, 66px);
      width: auto;
      display: block;
    }

    /* --- Body content ---------------------------------------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      line-height: 1.3;
    }
    main .title {
      margin: 0;
      font-weight: 700;
      font-size: clamp(1.5rem, 5vw, 3rem);
    }
    main .subtitle {
      margin: 0.5rem 0 0;
      font-weight: 400;
      font-size: clamp(1rem, 3vw, 1.5rem);
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <header class="banner">
    <img src="relay-logo.png" alt="Project RELAY" />
  </header>

  <main>
    <p class="title">Public Dashboard</p>
    <p class="subtitle">Under Construction 🏗 🚚</p>
  </main>
</body>
</html>
