<!DOCTYPE html>
<!--
  Project: Bangladesh Project Relay
  File: frontend/public_dashboard/index.html
  Author: Ronan Wallace (https://github.com/ronanwa)

  Public dashboard - STANDALONE DEMO (currently the deployed page).
  NO backend / database connection: the pins come from a hardcoded
  SAMPLE_REPORTS array below - 50 synthetic flood condition reports
  scattered across three clusters (Dhaka / Chattogram / Sylhet). The first
  20 are the rows from add_sample_data.sql (coordinates repositioned); the
  rest are generated. Safe to deploy on its own via GitHub Pages before the
  API is live.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project RELAY Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png?v=4" />

  <!-- Fonts used on project-relay.org: Instrument Sans (body/headings),
       Public Sans (nav links). Both open-source, served by Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;600;700&display=swap"
  />

  <!-- Leaflet (open-source map library, OpenStreetMap tiles, no API key) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root {
      --relay-blue: #b0c5de;   /* banner background, matches project-relay.org logo */
      --ink: #0d1b2a;          /* dark navy used across the Project Relay site */
    }

    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: "Instrument Sans", Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #f5f5f5;
    }

    /* --- Banner ------------------------------------------------ */
    .banner {
      background: var(--relay-blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1rem, 4vw, 3rem);
      flex: 0 0 auto;
    }
    .banner a { display: flex; }
    .banner img {
      height: clamp(44px, 8vw, 66px);
      width: auto;
      display: block;
    }
    .banner .home-link {
      color: #ffffff;   /* matches the nav links on project-relay.org */
      text-decoration: none;
      font-family: "Public Sans", Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
    }
    .banner .home-link:hover { text-decoration: underline; }

    /* --- Map -------------------------------------------------- */
    #map {
      flex: 1 1 auto;
      width: 100%;
    }

    /* Stacked overlay panel, top-left of the map. */
    .overlay {
      position: absolute;
      top: calc(clamp(44px, 8vw, 66px) + 0.75rem);
      left: 0.75rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      max-height: calc(100% - clamp(44px, 8vw, 66px) - 1.5rem);
      overflow-y: auto;
      padding-right: 4px;   /* room for the scrollbar */
    }

    .notice,
    #status,
    .filter,
    .filter-count,
    .clear-filters {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 5px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      text-align: left;
      line-height: 1.3;
      font-size: 14px;
    }
    .notice .notice-title { font-weight: 700; }
    .notice .notice-sub { font-size: 0.9em; opacity: 0.8; }

    /* --- Synthetic-data notice + info popover --------------- */
    #status {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-btn {
      border: none;
      background: none;
      padding: 0;
      font-size: 15px;
      line-height: 1;
      color: var(--ink);
      cursor: pointer;
    }
    .info-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 230px;
      padding: 8px 10px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      font-size: 12px;
      line-height: 1.4;
      z-index: 1001;
    }
    .info-popover[hidden] { display: none; }

    /* --- Condition filter (collapsible) --------------------- */
    .filter summary {
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;               /* hide default disclosure triangle */
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter summary::-webkit-details-marker { display: none; }
    .filter summary::before {
      content: "\25B8";               /* ▸ */
      font-size: 0.8em;
    }
    .filter[open] summary::before { content: "\25BE"; }  /* ▾ */
    .filter[open] summary { margin-bottom: 4px; }
    .filter ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .filter li {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 1px 0;
    }
    .filter .filter-dot {
      flex: 0 0 auto;
      width: 13px;
      height: 13px;
      padding: 0;
      border: 1.5px solid #555;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .filter .filter-dot:hover { border-color: #000; }
    .filter .filter-dot[aria-pressed="true"] {
      background: #EC635E;
      border-color: #000;
    }
    /* --- Clear-all-filters button (its own box) ------------- */
    .clear-filters {
      font: inherit;
      font-size: 13px;
      font-weight: 400;
      color: var(--ink);
      cursor: pointer;
      border: 1px solid #999;
    }
    .clear-filters:hover { border-color: #000; background: #f0f0f0; }

    /* --- Report popup --------------------------------------- */
    .leaflet-popup-content { margin: 10px 12px; }
    .report-popup {
      font-size: 12px;
      line-height: 1.5;
    }
    .report-popup h3 {
      margin: 0 0 4px;
      font-size: 13px;
      text-decoration: underline;
    }
    .report-popup .meta-row > span:first-child { font-weight: 600; }
    .report-popup hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 6px 0;
    }
    .report-popup .depth { margin-bottom: 4px; }
    .report-popup .depth > span:first-child { font-weight: 600; }
    .report-popup ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .report-popup li {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .report-popup input[type="checkbox"] {
      margin: 0;
      pointer-events: none;
    }
    .report-popup .coords {
      margin-top: 6px;
      opacity: 0.65;
      font-size: 11px;
    }
  </style>
</head>

      { report_id: 40, timestamp: "2026-07-20T17:16:00+00:00", latitude: 22.5600, longitude: 91.8800, submission_type: "voice_call", flood_depth: "waist",       food_available: false, water_available: false, electricity_available: false, flood_water_rising_fast: true,  home_damaged: true,  road_damaged: true,  family_member_sick: true,  family_member_injured: false, family_member_missing: false, flood_shelter_crowded: true,  daily_job_affected: true,  has_attachment: false },
      { report_id: 41, timestamp: "2026-07-20T17:24:00+00:00", latitude: 22.1800, longitude: 91.8200, submission_type: "mobile_app", flood_depth: "knee",        food_available: false, water_available: true,  electricity_available: false, flood_water_rising_fast: true,  home_damaged: false, road_damaged: false, family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: false, daily_job_affected: true,  has_attachment: false },
      { report_id: 42, timestamp: "2026-07-20T17:32:00+00:00", latitude: 22.5050, longitude: 91.7350, submission_type: "voice_call", flood_depth: "ankle",       food_available: true,  water_available: false, electricity_available: true,  flood_water_rising_fast: false, home_damaged: false, road_damaged: true,  family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: false, daily_job_affected: true,  has_attachment: false },
      { report_id: 43, timestamp: "2026-07-20T17:40:00+00:00", latitude: 22.3300, longitude: 91.9900, submission_type: "mobile_app", flood_depth: "knee",        food_available: true,  water_available: true,  electricity_available: true,  flood_water_rising_fast: true,  home_damaged: false, road_damaged: false, family_member_sick: true,  family_member_injured: false, family_member_missing: false, flood_shelter_crowded: false, daily_job_affected: true,  has_attachment: false },
      // --- Sylhet cluster (additional) ---
      { report_id: 44, timestamp: "2026-07-20T17:50:00+00:00", latitude: 25.0400, longitude: 91.9600, submission_type: "voice_call", flood_depth: "waist",       food_available: false, water_available: false, electricity_available: false, flood_water_rising_fast: true,  home_damaged: true,  road_damaged: true,  family_member_sick: false, family_member_injured: false, family_member_missing: true,  flood_shelter_crowded: true,  daily_job_affected: true,  has_attachment: true  },
      { report_id: 45, timestamp: "2026-07-20T17:58:00+00:00", latitude: 24.7300, longitude: 91.7600, submission_type: "mobile_app", flood_depth: "knee",        food_available: false, water_available: true,  electricity_available: true,  flood_water_rising_fast: true,  home_damaged: false, road_damaged: false, family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: true,  daily_job_affected: true,  has_attachment: false },
      { report_id: 46, timestamp: "2026-07-20T18:06:00+00:00", latitude: 24.9900, longitude: 91.7200, submission_type: "voice_call", flood_depth: "ankle",       food_available: true,  water_available: true,  electricity_available: true,  flood_water_rising_fast: false, home_damaged: false, road_damaged: false, family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: false, daily_job_affected: false, has_attachment: false },
      { report_id: 47, timestamp: "2026-07-20T18:14:00+00:00", latitude: 24.7700, longitude: 92.0500, submission_type: "mobile_app", flood_depth: "below_ankle", food_available: true,  water_available: true,  electricity_available: true,  flood_water_rising_fast: false, home_damaged: false, road_damaged: false, family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: false, daily_job_affected: true,  has_attachment: false },
      { report_id: 48, timestamp: "2026-07-20T18:22:00+00:00", latitude: 25.0700, longitude: 91.8400, submission_type: "voice_call", flood_depth: "waist",       food_available: false, water_available: false, electricity_available: false, flood_water_rising_fast: true,  home_damaged: true,  road_damaged: true,  family_member_sick: true,  family_member_injured: true,  family_member_missing: false, flood_shelter_crowded: true,  daily_job_affected: true,  has_attachment: false },
      { report_id: 49, timestamp: "2026-07-20T18:30:00+00:00", latitude: 24.8100, longitude: 91.9900, submission_type: "mobile_app", flood_depth: "knee",        food_available: false, water_available: true,  electricity_available: true,  flood_water_rising_fast: false, home_damaged: false, road_damaged: false, family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: true,  daily_job_affected: true,  has_attachment: false },
      { report_id: 50, timestamp: "2026-07-20T18:38:00+00:00", latitude: 24.9500, longitude: 91.6800, submission_type: "voice_call", flood_depth: "ankle",       food_available: true,  water_available: false, electricity_available: true,  flood_water_rising_fast: false, home_damaged: false, road_damaged: false, family_member_sick: false, family_member_injured: false, family_member_missing: false, flood_shelter_crowded: false, daily_job_affected: true,  has_attachment: false },
    ];

    const statusTextEl = document.getElementById("statusText");
    const filterCountEl = document.getElementById("filterCount");

    // Info popover on the synthetic-data notice.
    const infoBtn = document.getElementById("infoBtn");
    const infoPopover = document.getElementById("infoPopover");
    infoBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = !infoPopover.hasAttribute("hidden");
      infoPopover.toggleAttribute("hidden", isOpen);
      infoBtn.setAttribute("aria-expanded", String(!isOpen));
    });
    document.addEventListener("click", () => {
      if (!infoPopover.hasAttribute("hidden")) {
        infoPopover.setAttribute("hidden", "");
        infoBtn.setAttribute("aria-expanded", "false");
      }
    });

    // Centre roughly on Bangladesh until we have data to fit to.
    const map = L.map("map", { zoomControl: false }).setView([23.685, 90.356], 7);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    // Standard OpenStreetMap basemap - free, no API key, and the most
    // widely-reachable tile host. Renders Bengali place names correctly.
    const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    });
    tiles.on("tileerror", () => {
      statusTextEl.textContent = "Basemap tiles failed to load (network / firewall?)";
    });
    tiles.addTo(map);

    // Report markers: circle filled with the Project RELAY red, black outline.
    const MARKER_STYLE = {
      radius: 7,
      fillColor: "#EC635E",
      fillOpacity: 1,
      color: "#000000",
      weight: 2,
      opacity: 1,
    };

    // Style for reports filtered OUT by the condition filter - still shown
    // on the map, but greyed back.
    const DIMMED_STYLE = {
      radius: 7,
      fillColor: "#9a9a9a",
      fillOpacity: 0.85,
      color: "#444444",
      weight: 2,
      opacity: 0.85,
    };

    // Boolean condition fields.
    //   label       - used in the report popup (always the plain field name)
    //   filterLabel - used in the Condition Filter (defaults to label)
    //   invert      - if true, the filter matches reports where the field is
    //                 FALSE (e.g. "Food unavailable" -> food_available == false)
    const CONDITION_FIELDS = [
      { key: "food_available",          label: "Food available",         filterLabel: "Food unavailable",        invert: true },
      { key: "water_available",         label: "Water available",        filterLabel: "Water unavailable",       invert: true },
      { key: "electricity_available",   label: "Electricity available",  filterLabel: "Electricity unavailable", invert: true },
      { key: "flood_water_rising_fast", label: "Flood water rising fast" },
      { key: "home_damaged",            label: "Home damaged" },
      { key: "road_damaged",            label: "Road damaged" },
      { key: "family_member_sick",      label: "Family member sick" },
      { key: "family_member_injured",   label: "Family member injured" },
      { key: "family_member_missing",   label: "Family member missing" },
      { key: "flood_shelter_crowded",   label: "Flood shelter crowded" },
      { key: "daily_job_affected",      label: "Daily job affected" },
      { key: "has_attachment",          label: "Has attachment" },
    ];

    // Reported flood_depth values, shallowest to deepest. Used by the
    // Water Depth Filter (multi-select: a report matches if its depth is one
    // of the selected options).
    const DEPTH_OPTIONS = [
      ["below_ankle", "Below ankle"],
      ["ankle", "Ankle"],
      ["knee", "Knee"],
      ["waist", "Waist"],
    ];

    function formatTime(v) {
      if (!v) return "—";
      return String(v).replace("T", " ").replace("+00:00", " UTC");
    }

    function popupHtml(report) {
      const conditions = CONDITION_FIELDS.map(({ key, label }) => {
        const checked = report[key] === true ? " checked" : "";
        return `<li><input type="checkbox" tabindex="-1"${checked} /><span>${label}</span></li>`;
      }).join("");

      return `
        <div class="report-popup">
          <h3>Flood Condition Report #${report.report_id}</h3>
          <div class="meta-row"><span>Time:</span> ${formatTime(report.timestamp)}</div>
          <div class="meta-row"><span>Source:</span> ${String(report.submission_type).replace(/_/g, " ")}</div>
          <div class="meta-row"><span>Location:</span> ${report.latitude}, ${report.longitude}</div>
          <hr />
          <div class="depth"><span>Flood depth:</span> ${String(report.flood_depth).replace(/_/g, " ")}</div>
          <ul>${conditions}</ul>
        </div>
      `;
    }

    // { report, marker } for every rendered report - the condition filter
    // restyles these in place rather than adding/removing them.
    const reportMarkers = [];

    function renderReports(reports) {
      for (const report of reports) {
        if (report.latitude == null || report.longitude == null) continue;
        const marker = L.circleMarker(
          [report.latitude, report.longitude],
          MARKER_STYLE
        ).bindPopup(popupHtml(report), { closeButton: false });
        marker.addTo(map);
        reportMarkers.push({ report, marker });
      }

      if (reportMarkers.length > 0) {
        const group = L.featureGroup(reportMarkers.map((m) => m.marker));
        map.fitBounds(group.getBounds().pad(0.1));
      }
    }

    // Conditions currently toggled on in the Condition Filter, each { key, invert }.
    function activeConditions() {
      return [
        ...document.querySelectorAll('#conditionFilter .filter-dot[aria-pressed="true"]'),
      ].map((btn) => ({
        key: btn.dataset.condition,
        invert: btn.dataset.invert === "1",
      }));
    }

    // Depths currently toggled on in the Water Depth Filter.
    function selectedDepths() {
      return [
        ...document.querySelectorAll('#depthFilter .filter-dot[aria-pressed="true"]'),
      ].map((btn) => btn.dataset.depth);
    }

    // A report passes the condition filter when every active condition matches.
    // "invert" conditions match when the field is false; the rest when it is
    // true. With no active conditions, every report passes.
    function reportPassesConditions(report, active) {
      return active.every(({ key, invert }) =>
        invert ? report[key] === false : report[key] === true
      );
    }

    // A report passes the depth filter when its depth is one of the selected
    // ones. With nothing selected, every report passes.
    function reportPassesDepth(report, depths) {
      return depths.length === 0 || depths.includes(report.flood_depth);
    }

    function applyFilters() {
      const active = activeConditions();
      const depths = selectedDepths();
      let shown = 0;

      for (const { report, marker } of reportMarkers) {
        const pass =
          reportPassesDepth(report, depths) &&
          reportPassesConditions(report, active);
        marker.setStyle(pass ? MARKER_STYLE : DIMMED_STYLE);
        if (pass) {
          marker.bringToFront();
          shown += 1;
        }
      }

      filterCountEl.textContent =
        `Showing ${shown} of ${reportMarkers.length} reports`;
    }

    renderReports(SAMPLE_REPORTS);

    // Build one row: a circular toggle button + label. `data` is the dataset
    // to attach to the button (e.g. { condition, invert } or { depth }).
    function filterRow(label, data) {
      const li = document.createElement("li");

      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "filter-dot";
      Object.assign(dot.dataset, data);
      dot.setAttribute("aria-pressed", "false");
      dot.setAttribute("aria-label", label);
      dot.addEventListener("click", () => {
        const pressed = dot.getAttribute("aria-pressed") === "true";
        dot.setAttribute("aria-pressed", String(!pressed));
        applyFilters();
      });

      const text = document.createElement("span");
      text.textContent = label;

      li.append(dot, text);
      return li;
    }

    // Condition Filter - one row per CONDITION_FIELDS entry (same list the
    // popups use).
    function buildConditionFilter() {
      const list = document.getElementById("conditionFilter");
      for (const { key, label, filterLabel, invert } of CONDITION_FIELDS) {
        list.append(
          filterRow(filterLabel || label, {
            condition: key,
            invert: invert ? "1" : "",
          })
        );
      }
    }

    // Water Depth Filter - one row per DEPTH_OPTIONS entry.
    function buildDepthFilter() {
      const list = document.getElementById("depthFilter");
      for (const [value, label] of DEPTH_OPTIONS) {
        list.append(filterRow(label, { depth: value }));
      }
    }

    buildConditionFilter();
    buildDepthFilter();
    applyFilters();

    // "Clear all filters" - release every toggle (condition + depth) and show
    // all reports again.
    document.getElementById("clearFilters").addEventListener("click", () => {
      document
        .querySelectorAll('.filter-dot[aria-pressed="true"]')
        .forEach((btn) => btn.setAttribute("aria-pressed", "false"));
      applyFilters();
    });
  </script>
